[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "villa-ecommerce-sdk"
version = "0.1.0"
description = "Python SDK for connecting third-party applications to Villa Market ecommerce engine. Provides access to product catalogs, inventory data, and payment processing with S3-based caching."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Villa Ecommerce SDK Contributors"}
]
keywords = ["villa", "ecommerce", "api", "sdk", "products", "inventory", "payments", "supermarket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pandas>=1.5.0",
    "requests>=2.28.0",
    "boto3>=1.26.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/VillaEcommerceSdk"
Documentation = "https://github.com/your-org/VillaEcommerceSdk/tree/main/python"
Repository = "https://github.com/your-org/VillaEcommerceSdk"
Issues = "https://github.com/your-org/VillaEcommerceSdk/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/htmlcov"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "basic"
extraPaths = ["src"]

